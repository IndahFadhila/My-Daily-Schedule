<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jadwal harian pribadi: weekday, weekend, dan laporan progres. Otomatis nunjukin kegiatan sekarang, checklist tersimpan di perangkat.">
<meta name="theme-color" content="#D5E4F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Indah's Daily">
<meta name="mobile-web-app-capable" content="yes">
<title>Indah's Daily</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>

<div class="particles" aria-hidden="true">
  <span style="--x:6%;--s:4px;--c:rgba(255,246,201,.85);--d:13s;--dl:0s;--dx:22px"></span>
  <span style="--x:14%;--s:3px;--c:rgba(255,255,255,.7);--d:15s;--dl:2s;--dx:-18px"></span>
  <span style="--x:22%;--s:5px;--c:rgba(255,215,120,.6);--d:12s;--dl:5s;--dx:26px"></span>
  <span style="--x:32%;--s:3px;--c:rgba(255,255,255,.75);--d:16s;--dl:1s;--dx:-14px"></span>
  <span style="--x:40%;--s:4px;--c:rgba(255,246,201,.7);--d:14s;--dl:6s;--dx:20px"></span>
  <span style="--x:48%;--s:6px;--c:rgba(255,215,120,.5);--d:17s;--dl:3s;--dx:-22px"></span>
  <span style="--x:56%;--s:3px;--c:rgba(255,255,255,.75);--d:13s;--dl:8s;--dx:18px"></span>
  <span style="--x:64%;--s:4px;--c:rgba(255,246,201,.8);--d:15s;--dl:2s;--dx:-20px"></span>
  <span style="--x:72%;--s:5px;--c:rgba(255,215,120,.55);--d:12s;--dl:7s;--dx:24px"></span>
  <span style="--x:80%;--s:3px;--c:rgba(255,255,255,.7);--d:16s;--dl:4s;--dx:-16px"></span>
  <span style="--x:88%;--s:4px;--c:rgba(255,246,201,.75);--d:14s;--dl:1s;--dx:22px"></span>
  <span style="--x:94%;--s:3px;--c:rgba(255,255,255,.7);--d:15s;--dl:9s;--dx:-18px"></span>
</div>

<header class="top">
  <h1><span aria-hidden="true">🌤️</span> Indah's Daily</h1>
  <div class="tabs" id="tabs" role="tablist" aria-label="Pilih tampilan"></div>
</header>

<main>
  <section class="hero" aria-live="polite" aria-atomic="true">
    <div class="eyebrow"><span class="pulse-dot" aria-hidden="true"></span> SEKARANG</div>
    <div class="now-title">
      <span class="now-icon" id="nowIcon" aria-hidden="true">⏰</span>
      <span id="nowTitle">Memuat...</span>
    </div>
    <div class="now-desc" id="nowDesc"></div>
    <div class="row">
      <span class="pill-info" id="nowClock" aria-label="Jam sekarang">--:--</span>
      <span class="pill-info pill-next" id="nextInfo">-</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-label"><span>Progres hari ini</span><span id="progressPct">0%</span></div>
      <div class="progress-track" id="progressTrack" role="progressbar"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
           aria-label="Progres kegiatan hari ini">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="actions" id="actions">
      <button class="action primary" id="jumpBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        Ke sekarang
      </button>
      <button class="action" id="checkAllBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
        Centang semua
      </button>
      <button class="action" id="clearAllBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        Kosongkan
      </button>
      <button class="action" id="notifBtn" type="button" aria-pressed="false">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.888 17.888 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><path d="m2 2 20 20"/></svg>
        Notif
      </button>
    </div>
  </section>

  <div class="view" id="scheduleView">
    <ol class="timeline" id="timeline" aria-label="Daftar kegiatan"></ol>
    <div class="legend" id="legend" aria-label="Keterangan kategori"></div>
  </div>

  <div class="view" id="reportView" hidden></div>

  <footer class="info-note">
    <span aria-hidden="true">💾</span>
    Data tersimpan di perangkat ini &amp; reset tiap hari baru
  </footer>
  <div class="credit-pill">
    Made with <span aria-hidden="true">💜</span> by
    <a href="https://github.com/IndahFadhila" target="_blank" rel="noopener noreferrer">Indah Fadhila</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/IndahFadhila/My-Daily-Schedule" target="_blank" rel="noopener noreferrer">Source</a>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMsg">
    <div class="modal-icon" id="modalIcon" aria-hidden="true">🤔</div>
    <h3 class="modal-title" id="modalTitle">Judul</h3>
    <p class="modal-msg" id="modalMsg">Pesan.</p>
    <div class="modal-actions">
      <button class="btn-modal btn-secondary" id="modalCancel" type="button">Batal</button>
      <button class="btn-modal btn-primary" id="modalOk" type="button">Ya</button>
    </div>
  </div>
</div>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
</body>
</html>
